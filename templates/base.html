<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} · {{ site.name }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ css_href }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body class="page-{{ active }}">
<div class="shell">

  <header class="site-header">
    <div class="site-header-inner">
      <div class="header-top-row">
        <div>
          <a class="site-title" href="{{ home_href }}">{{ site.name }}</a>
          <span class="site-tag">{{ S.site_tagline }}</span>
        </div>
        <div class="lang-toggle">
          <span class="lang-current">{{ S.lang_label }}</span>
          <span class="lang-sep">/</span>
          <a href="{{ toggle_href }}">{{ S.other_lang_label }}</a>
        </div>
      </div>
    </div>
    <div class="tabbar-wrap">
      <nav class="tabbar">
        <a href="{{ home_href }}" class="{{ 'active' if active=='home' else '' }}">{{ S.home }}</a>
        <a href="{{ cv_href }}" class="{{ 'active' if active=='cv' else '' }}">{{ S.cv }}</a>
        <a href="{{ math_href }}" class="{{ 'active' if active=='math' else '' }}">{{ S.math_tab }}</a>
        <a href="{{ physics_href }}" class="{{ 'active' if active=='physics' else '' }}">{{ S.physics_tab }}</a>
        <a href="{{ music_href }}" class="{{ 'active' if active=='music' else '' }}">{{ S.music_tab }}</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="panel">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    <span>&copy; {{ year }} {{ site.name }} — {{ S.footer_built }}</span>
    <span>{{ S.footer_school }}</span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false},
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  });
</script>
</body>
</html>
