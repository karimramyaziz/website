{% extends "base.html" %}
{% block content %}

<div class="cv-head">
  <div class="eyebrow" style="margin-bottom:10px;">{{ eyebrow }}</div>
  <h1 class="title">{{ S.cv_title }}</h1>
  {% if cv_pdf_href %}
  <a class="pdf-open-link" href="{{ cv_pdf_href }}" target="_blank" rel="noopener">{{ S.cv_open }} ↗</a>
  {% endif %}
</div>

<article class="cv-body">
  {{ cv_body_html | safe }}
</article>

{% endblock %}
